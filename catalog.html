<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Каталог — Nexora</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="header">
    <div class="container header-content">
        <a href="index.html" class="logo">nexora</a>

        <nav>
            <a href="index.html">Главная</a>
            <a href="catalog.html">Каталог</a>
            <a href="orders.html">Заказы</a>
            <a href="admin.html">Админ</a>
        </nav>

        <a href="cart.html" class="cart-link">
            Корзина <span id="cartCount">0</span>
        </a>
    </div>
</header>

<main class="container page">

    <div class="page-header">
        <h1>Каталог</h1>
        <p>Выберите подходящую бытовую технику</p>
    </div>

    <div class="catalog-tools">

        <input
            type="text"
            id="searchInput"
            placeholder="Поиск товара..."
        >

        <select id="categorySelect">
            <option value="all">Все категории</option>
            <option value="Холодильники">Холодильники</option>
            <option value="Стиральные машины">Стиральные машины</option>
            <option value="Телевизоры">Телевизоры</option>
            <option value="Пылесосы">Пылесосы</option>
            <option value="Кухонная техника">Кухонная техника</option>
        </select>

        <select id="sortSelect">
            <option value="default">По умолчанию</option>
            <option value="cheap">Сначала дешевые</option>
            <option value="expensive">Сначала дорогие</option>
        </select>

    </div>

    <div id="catalogProducts" class="product-grid"></div>

</main>

<footer class="footer">
    <div class="container">
        <strong>nexora</strong>
        <p>Магазин бытовой техники</p>
    </div>
</footer>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/catalog.js"></script>

</body>
</html>
