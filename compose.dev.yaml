services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_BASE_URL: /api
      VITE_DOCKER_DEV: "true"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    ports: !override
      - "127.0.0.1:5173:5173"

volumes:
  frontend-node-modules:
