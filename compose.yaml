
services:
  postgres:
    image: postgres:17
    container_name: nexora-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: nexora
      POSTGRES_USER: nexora_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - nexora-data:/var/lib/postgresql/data

volumes:
  nexora-data:
