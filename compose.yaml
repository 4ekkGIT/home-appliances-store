
services:
  postgres:
    image: postgres:17
    container_name: nexora-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: nexora
      POSTGRES_USER: nexora_user
      POSTGRES_PASSWORD: change_me
    ports:
      - "5432:5432"
    volumes:
      - nexora-data:/var/lib/postgresql/data

volumes:
  nexora-data:
