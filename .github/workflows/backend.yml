name: Backend checks

on:
  push:
    paths:
      - "backend/**"
      - ".env.example"
      - "README.md"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".env.example"
      - "README.md"
      - ".github/workflows/backend.yml"

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: nexora
          POSTGRES_USER: nexora_user
          POSTGRES_PASSWORD: ci-only-database-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexora_user -d nexora"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_PASSWORD: ci-only-database-password
      DB_URL: jdbc:postgresql://localhost:5432/nexora
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: ci-only-admin-password-not-for-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run backend integration tests
        run: ./mvnw --batch-mode test
        working-directory: backend

      - name: Run Postman API collection
        shell: bash
        working-directory: backend
        run: |
          ./mvnw --batch-mode -q spring-boot:run &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT

          for attempt in {1..30}; do
            if curl --silent --fail http://localhost:8080/api/products >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "Backend did not become ready"
              exit 1
            fi
            sleep 2
          done

          npx --yes newman@6.2.1 run "postman/Nexora Catalog.postman_collection.json" \
            --env-var "baseUrl=http://localhost:8080" \
            --env-var "username=$ADMIN_EMAIL" \
            --env-var "password=$ADMIN_PASSWORD" \
            --reporters cli \
            --bail
