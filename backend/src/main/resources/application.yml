spring:
  application:
    name: nexora-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/nexora}
    username: nexora_user
    password: ${POSTGRES_PASSWORD:AVERYSTRONGPASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
      open-in-view: false

server:
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: lax

app:
  bootstrap-admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}