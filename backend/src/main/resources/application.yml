spring:
  application:
    name: nexora-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/nexora}
    username: nexora_user
    password: ${POSTGRES_PASSWORD:AVERYSTRONGPASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
      open-in-view: false
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_STARTTLS_ENABLE:false}

server:
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: lax

app:
  bootstrap-admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
  email-verification:
    base-url: ${EMAIL_VERIFICATION_BASE_URL:http://localhost:5173/verify-email}
    token-validity-hours: ${EMAIL_VERIFICATION_TOKEN_VALIDITY_HOURS:24}