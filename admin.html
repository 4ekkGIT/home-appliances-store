<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ — Nexora</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="header">
    <div class="container header-content">
        <a href="index.html" class="logo">nexora</a>

        <nav>
            <a href="index.html">Главная</a>
            <a href="catalog.html">Каталог</a>
            <a href="orders.html">Заказы</a>
            <a href="admin.html">Админ</a>
        </nav>

        <a href="cart.html" class="cart-link">
            Корзина <span id="cartCount">0</span>
        </a>
    </div>
</header>

<main class="container page">

    <div class="page-header">
        <h1>Панель администратора</h1>
        <p>Управление товарами магазина</p>
    </div>

    <div class="admin-stats">

        <div class="stat-card">
            <span>Товаров</span>
            <strong id="productsCount">0</strong>
        </div>

        <div class="stat-card">
            <span>Заказов</span>
            <strong id="ordersCount">0</strong>
        </div>

        <div class="stat-card">
            <span>Категорий</span>
            <strong id="categoriesCount">0</strong>
        </div>

    </div>

    <div class="admin-section">

        <h2>Товары</h2>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Название</th>
                        <th>Категория</th>
                        <th>Цена</th>
                        <th>Наличие</th>
                    </tr>
                </thead>

                <tbody id="adminProducts"></tbody>
            </table>
        </div>

    </div>

</main>

<footer class="footer">
    <div class="container">
        <strong>nexora</strong>
        <p>Панель управления магазином</p>
    </div>
</footer>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/admin.js"></script>

</body>
</html>
